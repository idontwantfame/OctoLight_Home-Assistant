[build-system]
requires = [
    "setuptools>=68",
]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-HA-Light-Control"
version = "0.3.0"
description = "Home Assistant lights and switches, brightness, colour and print status automation for OctoPrint."
authors = [
    { name = "idontwantfame" },
    { name = "Mark Bloom > forked off Žiga Kralj", email = "markbloom@outlook.com" },
]
requires-python = ">=3.9,<4"
dependencies = [
    "requests>=2.28,<3",
]
dynamic = [
    "license",
]

[project.entry-points."octoprint.plugin"]
ha_light_control = "octoprint_ha_light_control"

[project.urls]
Homepage = "https://github.com/idontwantfame/OctoLight_Home-Assistant"
Source = "https://github.com/idontwantfame/OctoLight_Home-Assistant"

[project.optional-dependencies]
develop = [
    "pytest>=7,<10",
    "ruff>=0.9",
    "build>=1.2",
    "tomli>=2; python_version < '3.11'",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "octoprint_ha_light_control",
    "octoprint_ha_light_control.*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
